# Build only; TestFlight upload follows separately.
workflows:
  assisted-chat-ios:
    name: Tyre Rescue Assisted Chat - iOS
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: assisted-chat-app
    environment:
      node: 24.22.1
      xcode: '26.2'
      cocoapods: default
      # Signing comes from the team's Codemagic code signing identities
      # (Apple Distribution certificate + App Store profile for this bundle).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.tyrerescue.assistedchat
      groups:
        # EXPO_PUBLIC_MAPBOX_TOKEN: address search and maps; the build fails without it.
        - assisted_chat_ios_public
      vars:
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
        EXPO_PUBLIC_API_BASE_URL: https://www.tyrerescue.uk
        CM_RECURSIVE_SUBMODULE_INIT: 'false'
        DEVELOPER_DIR: /Applications/Xcode-26.2.app/Contents/Developer
    # Start explicitly from the UI or API; no automatic publishing trigger.
    scripts:
      - name: Verify build environment
        script: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(node --version)" = v24.22.1
          origin="$(git -C "$CM_BUILD_DIR" remote get-url origin)"
          case "$origin" in
            https://github.com/ahmadalwakai/tyrerescue|https://github.com/ahmadalwakai/tyrerescue.git) ;;
            *) echo 'Unexpected source repository'; exit 1 ;;
          esac
          if [ -z "${EXPO_PUBLIC_MAPBOX_TOKEN:-}" ]; then
            echo 'EXPO_PUBLIC_MAPBOX_TOKEN is missing from the assisted_chat_ios_public group.'
            exit 1
          fi
          node -e "const e=require('./app.json').expo; console.log('Building ' + e.ios.bundleIdentifier + ' ' + e.version + ' (' + e.ios.buildNumber + ')')"

      - name: Install dependencies
        script: |
          set -euo pipefail
          # The app's ESLint config extends the root config, and eslint plus
          # its plugins are installed at the repository root.
          (cd "$CM_BUILD_DIR" && npm ci --ignore-scripts --no-audit --no-fund)
          # Also applies the pinned expo-notifications patch (postinstall).
          npm ci --no-audit --no-fund

      - name: Typecheck, lint and test
        script: |
          set -euo pipefail
          npm run check

      - name: Generate native iOS project and install CocoaPods
        script: |
          set -euo pipefail
          npx --no-install expo prebuild --platform ios --no-install --clean
          printf 'export NODE_BINARY="%s"\n' "$(command -v node)" > ios/.xcode.env.local
          cd ios
          pod install --repo-update

      - name: Apply signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -euo pipefail
          workspace="$(ls -d ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcode-project build-ipa --workspace "$workspace" --scheme "$scheme"

    artifacts:
      - $CM_BUILD_DIR/assisted-chat-app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log


  customer-ios19-native:
    name: Tyre Rescue 1.0.4 (19) - customer iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    working_directory: tyre-rescue
    environment:
      node: 24.22.1
      xcode: '26.2'
      cocoapods: default
      groups:
        - customer_ios19_public
        - customer_ios19_signing
      vars:
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
        EXPO_PUBLIC_API_BASE_URL: https://www.tyrerescue.uk
        CUSTOMER_APP_DIR: tyre-rescue
        CUSTOMER_CI_DIR: ci/customer-ios19-codemagic
        CM_RECURSIVE_SUBMODULE_INIT: 'false'
        DEVELOPER_DIR: /Applications/Xcode-26.2.app/Contents/Developer
    # Start explicitly from the UI or API; no automatic publishing trigger.
    scripts:
      - name: Prepare isolated build workspace
        script: |
          set -euo pipefail
          umask 077
          test -n "${CM_BUILD_DIR:-}" && test -d "$CM_BUILD_DIR"
          test -n "${CM_BUILD_ID:-}" && test -n "${CM_ENV:-}"
          test "$(uname -m)" = arm64
          test "$(node --version)" = v24.22.1
          python3 - <<'PY'
          import os, subprocess
          origin = subprocess.check_output(['git', '-C', os.environ['CM_BUILD_DIR'], 'remote', 'get-url', 'origin'], text=True).strip()
          assert origin in ['https://github.com/ahmadalwakai/tyrerescue.git', 'https://github.com/ahmadalwakai/tyrerescue'], 'Unexpected source repository'
          PY
          customer_ci_temp="$(mktemp -d "${TMPDIR:-/tmp}/customer-ios19.XXXXXX")"
          printf 'CUSTOMER_CI_TEMP=%s\n' "$customer_ci_temp" >> "$CM_ENV"

      - name: Verify frozen source and install customer dependencies
        script: |
          set -euo pipefail
          env -u CUSTOMER_IOS_P12_BASE64 -u CUSTOMER_IOS_P12_PASSWORD -u CUSTOMER_IOS_PROFILE_BASE64 -u CM_API_TOKEN \
            bash "$CM_BUILD_DIR/$CUSTOMER_CI_DIR/install-dependencies.sh"

      - name: Typecheck and test customer booking and payment flows
        script: |
          set -euo pipefail
          env -u CUSTOMER_IOS_P12_BASE64 -u CUSTOMER_IOS_P12_PASSWORD -u CUSTOMER_IOS_PROFILE_BASE64 -u CM_API_TOKEN \
            bash "$CM_BUILD_DIR/$CUSTOMER_CI_DIR/check-customer.sh"

      - name: Generate native iOS project and install CocoaPods
        script: |
          set -euo pipefail
          env -u CUSTOMER_IOS_P12_BASE64 -u CUSTOMER_IOS_P12_PASSWORD -u CUSTOMER_IOS_PROFILE_BASE64 -u CM_API_TOKEN \
            bash "$CM_BUILD_DIR/$CUSTOMER_CI_DIR/prepare-native.sh"

      - name: Sign existing customer identity, export IPA and verify
        script: |
          set -euo pipefail
          unset CM_API_TOKEN
          bash "$CM_BUILD_DIR/$CUSTOMER_CI_DIR/build-native.sh"

    artifacts:
      - $CUSTOMER_CI_TEMP/customer-ios19-output/tyre-rescue-1.0.4-19.ipa
      - $CUSTOMER_CI_TEMP/customer-ios19-output/manifest.json

