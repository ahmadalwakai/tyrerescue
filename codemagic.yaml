workflows:
  assisted-ios57-upload:
    name: Assisted Chat 1.0.13 (57) - upload existing verified IPA only
    instance_type: mac_mini_m2
    max_build_duration: 20
    integrations:
      app_store_connect: Vibeset Codemagic
    environment:
      xcode: '26.2'
      groups:
        - assisted_ios57_upload
      vars:
        CI: '1'
        CM_RECURSIVE_SUBMODULE_INIT: 'false'
        DEVELOPER_DIR: /Applications/Xcode-26.2.app/Contents/Developer
    # Explicit API dispatch only. There are no automatic triggers or build steps.
    scripts:
      - name: Download and verify the already signed build 57
        script: |
          set -euo pipefail
          umask 077
          test "${CM_TRIGGER_SOURCE:-}" = api
          test -n "${CM_BUILD_DIR:-}" && test -n "${CM_BUILD_ID:-}"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.2'
          unset CM_API_TOKEN
          python3 "$CM_BUILD_DIR/ci/assisted-ios57-upload/download-verified-ipa.py"
    artifacts:
      - $CM_BUILD_DIR/verified-upload/assisted-chat-1.0.13-57.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
